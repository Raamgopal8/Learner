default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: /var/run/postgresql

development:
  <<: *default
  database: testplatform_development

test:
  <<: *default
  database: testplatform_test

production:
  <<: *default
  database: testplatform_production
