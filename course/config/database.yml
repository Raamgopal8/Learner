default: &default
  adapter: postgresql
  encoding: unicode
  username: <%= ENV['USER'] %>
  password: <%= ENV['DATABASE_PASSWORD'] %>
  host: localhost
  port: 5432
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: tutorx_course

test:
  <<: *default
  database: tutorx_test

production:
  <<: *default
  database: tutorx_production
